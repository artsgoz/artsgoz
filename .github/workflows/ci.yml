name: CI

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging

permissions:
  contents: read

jobs:
  validate-branch-flow:
    name: Validate Branch Flow
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    steps:
      - name: Enforce staging → develop flow
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Direct PRs to 'develop' are not allowed."
            echo "Required flow: branch/* → staging → develop"
            echo "Please open your PR against 'staging' first."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-production:
    name: Deploy Production
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice
      - name: Deploy frontend
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-staging:
    name: Deploy Staging
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice
      - name: Deploy frontend-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend-staging --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice-staging --project chula-artsgoz-website --json 2>&1) && exit_code=0 || exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-preview:
    name: Deploy PR Preview
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:frontend && pnpm build:backoffice
      - name: Deploy frontend preview
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANNEL="pr${PR_NUMBER}"
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase_deploy() {
            npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
              --only frontend --expires 7d \
              --project chula-artsgoz-website 2>&1
          }
          output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "already exists"; then
            echo "Channel race condition — retrying..."
            sleep 3
            output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          fi
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — preview already deployed."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice preview
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANNEL="pr${PR_NUMBER}"
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase_deploy() {
            npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
              --only backoffice --expires 7d \
              --project chula-artsgoz-website 2>&1
          }
          output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "already exists"; then
            echo "Channel race condition — retrying..."
            sleep 3
            output=$(firebase_deploy) && exit_code=0 || exit_code=$?
          fi
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — preview already deployed."
            exit 0
          fi
          echo "$output"
          exit $exit_code
