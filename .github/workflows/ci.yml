name: CI

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-production:
    name: Deploy Production
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice
      - name: Deploy frontend
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend --project chula-artsgoz-website --json 2>&1)
          exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice --project chula-artsgoz-website --json 2>&1)
          exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-staging:
    name: Deploy Staging
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm build:frontend && pnpm build:backoffice
      - name: Deploy frontend-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:frontend-staging --project chula-artsgoz-website --json 2>&1)
          exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code
      - name: Deploy backoffice-staging
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          output=$(npx firebase-tools@latest deploy --only hosting:backoffice-staging --project chula-artsgoz-website --json 2>&1)
          exit_code=$?
          rm -f /tmp/firebase-sa.json
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "current active version"; then
            echo "Content unchanged — already deployed. Skipping."
            exit 0
          fi
          echo "$output"
          exit $exit_code

  deploy-preview:
    name: Deploy PR Preview
    needs: [lint, typecheck, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:frontend && pnpm build:backoffice
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          projectId: chula-artsgoz-website
          target: frontend
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHULA_ARTSGOZ_WEBSITE }}
          projectId: chula-artsgoz-website
          target: backoffice
